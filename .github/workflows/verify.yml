name: Verify application and backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stages/03_build/output/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stages/03_build/output/data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stages/03_build/output/data-pipeline/package-lock.json
      - run: npm ci
      - run: npm test

  supabase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stages/03_build/output
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - uses: denoland/setup-deno@v2
      - run: deno check supabase/functions/search-assistant/index.ts
      - run: deno check supabase/functions/ondemand-topup/index.ts
      - run: deno check supabase/functions/recompute-restaurant-score/index.ts
      - run: supabase start
      - run: supabase test db
