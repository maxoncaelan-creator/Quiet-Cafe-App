name: Deploy web

# Needs 4 GitHub Actions secrets before the deploy step will succeed —
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_URL,
# SUPABASE_ANON_KEY. See PLATFORM_SETUP.md's "Web" section (in
# stages/03_build/output/app/) for where each comes from.
#
# GOOGLE_WEB_CLIENT_ID below is hardcoded, not a secret — per
# oauth_service.dart's own comment, an OAuth client ID is "not secret, but
# environment-specific" (Google's model treats it as public; it's already
# committed in plain text in PLATFORM_SETUP.md). Found missing here
# 2026-08-19 after Caelan noticed the Google sign-in button silently
# absent on the deployed site — not a code bug, the app deliberately hides
# unconfigured sign-in options rather than showing a broken one
# (OAuthService.googleConfigured), so a missing dart-define here just
# looks like a missing button, not a build failure.
#
# This file must live at the repo root's .github/workflows/ — GitHub
# Actions never looks inside subdirectories for workflow files. The
# Flutter app itself lives at stages/03_build/output/app/, several
# levels below this repo's root, hence the working-directory below.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: stages/03_build/output/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=335462034836-93k0vrqkqha1kmaf87j5ne05t1vaafvc.apps.googleusercontent.com

      # wrangler pages deploy does NOT auto-create the Pages project (despite
      # what earlier docs here assumed, corrected 2026-08-19 after a real
      # deploy failure: "Project not found ... [code: 8000007]") — it has to
      # exist first. continue-on-error so this is a no-op once the project
      # exists (every run after the first).
      - uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create quiet-restaurant-finder --production-branch=main

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy stages/03_build/output/app/build/web --project-name=quiet-restaurant-finder --branch=main --commit-dirty=true
