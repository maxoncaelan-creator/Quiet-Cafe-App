name: quiet_restaurant_finder
description: Ranks Sydney restaurants by how quiet they are.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  noise_meter: ^5.0.0
  permission_handler: ^11.3.0
  go_router: ^14.6.2
  supabase_flutter: ^2.5.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  speech_to_text: ^7.0.0
  flutter_svg: ^2.0.10+1
  web: ^1.1.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/restaurants.json
    - assets/icons/google_logo.svg
