name: Deploy web

# First CI pipeline in this repo. Needs 4 GitHub Actions secrets before the
# deploy step will succeed — CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# SUPABASE_URL, SUPABASE_ANON_KEY. See PLATFORM_SETUP.md's "Web" section for
# where each comes from; none of them are set up from this session.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=quiet-restaurant-finder --branch=main
